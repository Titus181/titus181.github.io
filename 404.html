<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巷口大店長・來逛我的店</title>
<meta name="description" content="點進來看看這家巷口小店，也開一間自己的店。">
<meta property="og:title" content="來逛我的店｜巷口大店長">
<meta property="og:description" content="點進來看看這家巷口小店，也開一間自己的店。">
<meta property="og:type" content="website">
<meta name="apple-itunes-app" content="app-id=6822964697">
<style>
  :root { --cream: #FFF7E8; --ink: #2B2A27; --green: #2E6B4F; --red: #C8403A; --muted: #6E6A61; --card: #FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root { --cream: #1E1D1A; --ink: #F4EFE4; --green: #5BB08A; --red: #E2665F; --muted: #B5AFA3; --card: #2A2925; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 32px 16px 48px; text-align: center; }
  .sign { display: inline-block; background: var(--green); color: #fff; border-radius: 10px; padding: 10px 22px; font-size: 26px; font-weight: 700; letter-spacing: 2px; }
  .card { background: var(--card); border-radius: 18px; padding: 24px 18px; margin-top: 22px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  .level { color: var(--muted); margin: 10px 0 0; }
  .note { color: var(--muted); font-size: 14px; line-height: 1.6; }
  a.button { display: block; margin-top: 14px; padding: 14px; border-radius: 14px; font-size: 17px; font-weight: 700; text-decoration: none; }
  a.primary { background: var(--red); color: #fff; }
  footer { margin-top: 28px; font-size: 13px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="note">巷口大店長</p>
  <div class="sign" id="name">巷口小店</div>
  <p class="level" id="level"></p>
  <div class="card">
    <p id="lead">這家店的老闆邀請你來逛逛！</p>
    <a class="button primary" href="https://apps.apple.com/app/id6822964697">下載巷口大店長</a>
    <p class="note" id="hint">已經裝了 App 的話，點分享來的連結就會直接在 App 裡打開這間店。</p>
  </div>
  <footer><a href="/aislerise-site/privacy.html">隱私權政策</a></footer>
</main>
<script>
(() => {
  const api = "https://aislerise-prod.fly.dev";
  const match = location.pathname.match(/^\/v\/([23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6})\/?$/i);
  const lead = document.getElementById("lead");
  if (!match) {
    lead.textContent = "找不到這一頁。來開一間自己的巷口小店吧！";
    return;
  }
  const code = match[1].toUpperCase();
  fetch(api + "/v1/visits/" + code, { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(store => {
      if (store.schema !== "store-visit-v1") return;
      const name = typeof store.name === "string" && store.name ? store.name : "巷口小店";
      document.getElementById("name").textContent = name;
      document.title = name + "｜巷口大店長";
      if (Number.isInteger(store.level)) document.getElementById("level").textContent = "Lv." + store.level;
      const figures = Array.isArray(store.figures) ? store.figures.length : 0;
      lead.textContent = "「" + name + "」的店長邀請你來逛逛！" + (figures > 0 ? "收銀台還擺著 " + figures + " 隻店貓公仔。" : "");
    })
    .catch(status => {
      if (status === 404) lead.textContent = "這個連結已經換掉了。請店長再分享一次新的連結！";
    });
})();
</script>
</body>
</html>
